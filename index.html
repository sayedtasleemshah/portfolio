<script>
function toggleMenu() {
    const menu = document.getElementById("menu");
    menu.classList.toggle("active"); // Toggle menu visibility
}

// Close menu on clicking any menu link
const menuLinks = document.querySelectorAll("#menu a"); // Select all anchor tags inside the menu
menuLinks.forEach(link => {
    link.addEventListener("click", () => {
        const menu = document.getElementById("menu");
        menu.classList.remove("active"); // Hide menu
    });
});

const roles = [
    "Cybersecurity Enthusiast",
    "Junior Cybersecurity Specialist",
    "IT Support Learner"
];

let r = 0, c = 0, del = false;

function typing() {
    const t = roles[r];
    document.getElementById("typing").textContent =
        del ? t.substring(0, --c) : t.substring(0, ++c);
    if (!del && c === t.length) { setTimeout(() => del = true, 1000); }
    if (del && c === 0) { del = false; r = (r + 1) % roles.length; }
    setTimeout(typing, del ? 70 : 110);
}
typing();

ScrollReveal({
    distance: "60px",
    duration: 1400,
    delay: 200,
    reset: true
});

ScrollReveal().reveal(".reveal-top", { origin: "top" });
ScrollReveal().reveal(".reveal-left", { origin: "left" });
ScrollReveal().reveal(".reveal-right", { origin: "right" });
ScrollReveal().reveal(".reveal-bottom", { origin: "bottom" });
</script>
